name: Desktop bundle smoke

on:
  # Re-smoke an artifact that is already built, with the test scripts of any
  # pushed ref (the ref this is dispatched on): `gh workflow run
  # desktop-bundle-smoke.yml --ref <test-branch> -f platform=win32 -f arch=x64
  # -f format=msix -f sha=<built commit> -f commit-build=true
  # -f public-base=https://hermes-assets.nousresearch.com/`. No rebuild per test.
  workflow_dispatch:
    inputs:
      platform: {required: true, type: string}
      arch: {required: true, type: string}
      format: {required: true, type: string}
      sha: {description: Commit whose staged artifact is smoked, required: true, type: string}
      tag: {default: '', type: string}
      commit-build: {default: false, type: boolean}
      public-base: {required: false, default: '', type: string}
      artifact-id: {description: 'Existing GitHub native candidate artifact ID; no rebuild', default: '', type: string}
      artifact-run: {default: '', type: string}
      artifact-sha256: {description: 'Exact GitHub artifact archive digest', default: '', type: string}
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      format:
        required: true
        type: string
      sha:
        required: true
        type: string
      tag:
        default: ''
        type: string
      archive-tag:
        description: Archive ref the handoffs are staged under (attempt ref for stable phases).
        default: ''
        type: string
      commit-build:
        default: false
        type: boolean
      channel-build:
        default: ''
        type: string
      channel-request-sha256:
        default: ''
        type: string
      controller-sha:
        default: ''
        type: string
      disposable-run:
        default: ''
        type: string
      public-root:
        default: ''
        type: string
      public-base:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  native-candidate:
    name: Re-smoke native ${{ inputs.platform }}-${{ inputs.arch }} candidate
    if: github.event_name == 'workflow_dispatch' && inputs.artifact-id != ''
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_COMMIT: ${{ inputs.sha }}
      EXPECTED_TARGET: ${{ inputs.platform }}-${{ inputs.arch }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require Linux candidate on its native host
        env:
          PLATFORM: ${{ inputs.platform }}
          FORMAT: ${{ inputs.format }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pm.store import current_target
          if os.environ['PLATFORM'] != 'linux' or os.environ['FORMAT'] not in ('AppImage', 'deb') or current_target() != os.environ['EXPECTED_TARGET']:
              raise SystemExit('GitHub candidate re-smoke requires a native Linux AppImage or DEB installation')
          PYCODE
      - name: Install system desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64 libfuse2t64
      - name: Set up driver tools only
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          cache: false
          cache-python: false
          cache-node: false
          archive-inputs: false
      - name: Install locked smoke dependencies
        if: inputs.format == 'AppImage'
        run: npm ci --workspace tests-js --include-workspace-root --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Install locked package tools and smoke dependencies
        if: inputs.format == 'deb'
        run: |
          npm ci --workspace apps/desktop --workspace tests-js --include-workspace-root --ignore-scripts --no-audit --no-fund
          sudo apt-get install -y -qq rpm
          node node_modules/vitest/vitest.mjs run apps/desktop/scripts/run-electron-builder.test.mjs
      - name: Fetch exact existing candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          ARTIFACT_RUN: ${{ inputs.artifact-run }}
          ARTIFACT_SHA256: ${{ inputs.artifact-sha256 }}
        run: |
          python -m scripts.ci.native_candidate_artifact --artifact-id "$ARTIFACT_ID" --run "$ARTIFACT_RUN" --commit "$EXPECTED_COMMIT" --target "$EXPECTED_TARGET" --digest "$ARTIFACT_SHA256" --out "$RUNNER_TEMP/candidate-download"
      - name: Extract and inspect the exact artifact
        id: metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP/candidate-download/"*.AppImage)
          test "${#files[@]}" -eq 1
          chmod +x "${files[0]}"
          mkdir "$RUNNER_TEMP/candidate-extracted" "$RUNNER_TEMP/candidate-proof"
          cd "$RUNNER_TEMP/candidate-extracted"
          "${files[0]}" --appimage-extract > "$RUNNER_TEMP/candidate-proof/extraction.log"
          echo "CANDIDATE_APPIMAGE=${files[0]}" >> "$GITHUB_ENV"
          echo "CANDIDATE_ROOT=$PWD/squashfs-root/resources/agent-payload" >> "$GITHUB_ENV"
          echo "CANDIDATE_INSTALL=$PWD/squashfs-root" >> "$GITHUB_ENV"
      - name: Verify product identity architecture and provenance
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from pm.package import machine_matches_binary
          root = Path(os.environ['CANDIDATE_ROOT'])
          env = {**os.environ, 'HERMES_DESKTOP_VARIANT': 'bundled', 'HERMES_PAYLOAD_TAG': os.environ['RELEASE_TAG'], 'HERMES_BUILD_COMMIT': '' if os.environ['RELEASE_TAG'] else os.environ['EXPECTED_COMMIT']}
          name = subprocess.check_output(['node', '-e', "console.log(require('./apps/desktop/product-identity.cjs').displayName)"], text=True, env=env).strip()
          exe = Path(os.environ['CANDIDATE_INSTALL']) / name
          manifest = json.loads((root / 'manifest.json').read_text())
          for binary in (exe, root / manifest['runtime']['storePython']):
              if machine_matches_binary(binary, os.environ['EXPECTED_TARGET']) is not True:
                  raise SystemExit(f'Wrong native architecture: {binary.name}')
          artifact = Path(os.environ['CANDIDATE_APPIMAGE'])
          with artifact.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          proof = Path(os.environ['RUNNER_TEMP']) / 'candidate-proof'
          (proof / 'artifact.json').write_text(json.dumps({'commit': os.environ['EXPECTED_COMMIT'], 'target': os.environ['EXPECTED_TARGET'], 'name': artifact.name, 'sha256': digest, 'bytes': artifact.stat().st_size, 'nativeBinaryAudit': True}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'CANDIDATE_EXE={exe}' + chr(10))
          PYCODE
          node tests/install/e2e-assets/bundle-smoke-metadata.mjs stamp --platform linux --format AppImage --stamp "$CANDIDATE_INSTALL/resources/install-stamp.json" --commit "$EXPECTED_COMMIT" --tag "$RELEASE_TAG"
          cp "$RUNNER_TEMP/candidate-download/source-artifact.json" "$RUNNER_TEMP/candidate-proof/"
      - name: Prepare native installer packaging tools
        if: inputs.format == 'deb'
        run: |
          set -euo pipefail
          export HERMES_DESKTOP_VARIANT=bundled HERMES_PAYLOAD_TAG="$RELEASE_TAG"
          export HERMES_BUILD_COMMIT="$EXPECTED_COMMIT"
          if [ -n "$RELEASE_TAG" ]; then export HERMES_BUILD_COMMIT=; fi
          node apps/desktop/scripts/prepare-packaging-tools.mjs --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/package-tools" --cache "$RUNNER_TEMP/package-cache" --target "$EXPECTED_TARGET" --format deb --format rpm
          version=$(node tests/install/e2e-assets/bundle-smoke-metadata.mjs stamp --platform linux --format AppImage --stamp "$CANDIDATE_INSTALL/resources/install-stamp.json" --commit "$EXPECTED_COMMIT" --tag "$RELEASE_TAG" | tr -d '"')
          cp "$CANDIDATE_INSTALL/AppRun" "$RUNNER_TEMP/candidate-proof/supplier-AppRun"
          node -e 'console.log(JSON.stringify({electronBuilder:require("./node_modules/electron-builder/package.json").version,appBuilderLib:require("./node_modules/app-builder-lib/package.json").version}))' > "$RUNNER_TEMP/candidate-proof/supplier-versions.json"
          echo "HERMES_DESKTOP_VARIANT=$HERMES_DESKTOP_VARIANT" >> "$GITHUB_ENV"
          echo "HERMES_PAYLOAD_TAG=$HERMES_PAYLOAD_TAG" >> "$GITHUB_ENV"
          echo "HERMES_BUILD_COMMIT=$HERMES_BUILD_COMMIT" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Package existing native payload as DEB
        if: inputs.format == 'deb'
        run: |
          cd apps/desktop
          node scripts/run-electron-builder.mjs --prepared "$RUNNER_TEMP/package-tools/prepared.json" --prepackaged "$CANDIDATE_INSTALL" --linux deb --${{ inputs.arch }} -c.extraMetadata.version="$PACKAGE_VERSION" -c.directories.output="$RUNNER_TEMP/native-packages"
      - name: Retain unverified DEB before RPM packaging
        if: always() && inputs.format == 'deb'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aino-unverified-deb-${{ inputs.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-packages/*.deb
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - name: Package existing native payload as RPM
        if: inputs.format == 'deb'
        run: |
          cd apps/desktop
          node scripts/run-electron-builder.mjs --prepared "$RUNNER_TEMP/package-tools/prepared.json" --prepackaged "$CANDIDATE_INSTALL" --linux rpm --${{ inputs.arch }} -c.extraMetadata.version="$PACKAGE_VERSION" -c.directories.output="$RUNNER_TEMP/native-packages"
      - name: Record native installer hashes
        if: inputs.format == 'deb'
        run: |
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          artifacts = []
          for file in sorted((root / 'native-packages').iterdir()):
              if file.suffix not in ('.deb', '.rpm'):
                  continue
              with file.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              artifacts.append({'name': file.name, 'sha256': digest, 'bytes': file.stat().st_size})
          (root / 'candidate-proof/packages.json').write_text(json.dumps({'sourceCommit': os.environ['EXPECTED_COMMIT'], 'packagingCommit': os.environ['GITHUB_SHA'], 'artifacts': artifacts}, indent=2))
          PYCODE
      - name: Retain unverified native DEB and RPM files
        if: always() && inputs.format == 'deb'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aino-unverified-linux-packages-${{ inputs.arch }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-packages/*.deb
            ${{ runner.temp }}/native-packages/*.rpm
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - name: Install DEB through the native package manager
        if: inputs.format == 'deb'
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$RUNNER_TEMP/native-packages/"*.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get install -y "${packages[0]}"
          package=$(dpkg-deb --field "${packages[0]}" Package)
          PACKAGE_NAME="$package" python - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          original = Path(os.environ['CANDIDATE_EXE'])
          listing = subprocess.check_output(['dpkg', '-L', os.environ['PACKAGE_NAME']], text=True, encoding='utf-8').splitlines()
          executables = [Path(file) for file in listing if Path(file).name == original.name and Path(file).is_file() and not Path(file).is_symlink()]
          if len(executables) != 1:
              raise SystemExit('Expected one native DEB executable')
          installed = executables[0]
          for relative in (original.name, 'resources/app.asar', 'resources/install-stamp.json', 'resources/agent-payload/manifest.json'):
              paths = [original.parent / relative, installed.parent / relative]
              digests = []
              for file in paths:
                  with file.open('rb') as stream:
                      digests.append(hashlib.file_digest(stream, 'sha256').hexdigest())
              if digests[0] != digests[1]:
                  raise SystemExit(f'Installed DEB changes existing payload bytes: {relative}')
          payload = installed.parent / 'resources/agent-payload'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'CANDIDATE_EXE={installed}' + chr(10))
              stream.write(f'CANDIDATE_ROOT={payload}' + chr(10))
          PYCODE
      - name: Installed DEB startup login chat and tool smoke
        if: inputs.format == 'deb'
        run: |
          xvfb-run -a --server-args='-screen 0 1280x1024x24' node tests/install/e2e-assets/desktop-smoke.ts --exe "$CANDIDATE_EXE" --root "$CANDIDATE_ROOT" --origin bundled --home "$RUNNER_TEMP/deb-home" --user-data "$RUNNER_TEMP/deb-user-data" --out "$RUNNER_TEMP/candidate-proof/deb" --phase installed --expect-commit "$EXPECTED_COMMIT" --platform-account --tool-smoke
      - name: Retain verified native DEB
        if: inputs.format == 'deb'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aino-verified-deb-${{ inputs.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-packages/*.deb
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Install RPM on the native Ubuntu host
        if: inputs.format == 'deb'
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=("$RUNNER_TEMP/native-packages/"*.deb)
          rpm=("$RUNNER_TEMP/native-packages/"*.rpm)
          test "${#rpm[@]}" -eq 1
          sudo apt-get remove -y "$(dpkg-deb --field "${deb[0]}" Package)"
          # Dependencies come from Ubuntu apt; RPM's database cannot see them.
          sudo rpm -ivh --nodeps "${rpm[0]}"
          package=$(rpm -qp --queryformat '%{NAME}' "${rpm[0]}")
          PACKAGE_NAME="$package" python - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          original = Path(os.environ['CANDIDATE_INSTALL']) / Path(os.environ['CANDIDATE_EXE']).name
          listing = subprocess.check_output(['rpm', '-ql', os.environ['PACKAGE_NAME']], text=True, encoding='utf-8').splitlines()
          executables = [Path(file) for file in listing if Path(file).name == original.name and Path(file).is_file() and not Path(file).is_symlink()]
          if len(executables) != 1:
              raise SystemExit('Expected one native RPM executable')
          installed = executables[0]
          for relative in (original.name, 'resources/app.asar', 'resources/install-stamp.json', 'resources/agent-payload/manifest.json'):
              digests = []
              for file in (original.parent / relative, installed.parent / relative):
                  with file.open('rb') as stream:
                      digests.append(hashlib.file_digest(stream, 'sha256').hexdigest())
              if digests[0] != digests[1]:
                  raise SystemExit(f'Installed RPM changes existing payload bytes: {relative}')
          libraries = subprocess.check_output(['ldd', str(installed)], text=True, encoding='utf-8')
          if 'not found' in libraries:
              raise SystemExit(libraries)
          payload = installed.parent / 'resources/agent-payload'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'CANDIDATE_EXE={installed}' + chr(10))
              stream.write(f'CANDIDATE_ROOT={payload}' + chr(10))
          PYCODE
      - name: Installed RPM startup login chat and tool smoke
        if: inputs.format == 'deb'
        run: |
          xvfb-run -a --server-args='-screen 0 1280x1024x24' node tests/install/e2e-assets/desktop-smoke.ts --exe "$CANDIDATE_EXE" --root "$CANDIDATE_ROOT" --origin bundled --home "$RUNNER_TEMP/rpm-home" --user-data "$RUNNER_TEMP/rpm-user-data" --out "$RUNNER_TEMP/candidate-proof/rpm-ubuntu" --phase installed --expect-commit "$EXPECTED_COMMIT" --platform-account --tool-smoke
      - name: Retain native RPM with Ubuntu verification scope
        if: inputs.format == 'deb'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aino-rpm-ubuntu-smoked-${{ inputs.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-packages/*.rpm
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Direct AppImage startup login chat and tool smoke
        if: inputs.format == 'AppImage'
        id: direct
        continue-on-error: true
        run: |
          xvfb-run -a --server-args='-screen 0 1280x1024x24' node tests/install/e2e-assets/desktop-smoke.ts --appimage "$CANDIDATE_APPIMAGE" --exe "$CANDIDATE_EXE" --root "$CANDIDATE_ROOT" --origin bundled --home "$RUNNER_TEMP/direct-home" --user-data "$RUNNER_TEMP/direct-user-data" --out "$RUNNER_TEMP/candidate-proof/direct" --phase installed --expect-commit "$EXPECTED_COMMIT" --platform-account --tool-smoke
      - name: Extracted startup login chat and tool smoke
        if: inputs.format == 'AppImage'
        id: extracted
        continue-on-error: true
        run: |
          sudo chown root:root "$CANDIDATE_INSTALL/chrome-sandbox"
          sudo chmod 4755 "$CANDIDATE_INSTALL/chrome-sandbox"
          xvfb-run -a --server-args='-screen 0 1280x1024x24' node tests/install/e2e-assets/desktop-smoke.ts --exe "$CANDIDATE_EXE" --root "$CANDIDATE_ROOT" --origin bundled --home "$RUNNER_TEMP/extracted-home" --user-data "$RUNNER_TEMP/extracted-user-data" --out "$RUNNER_TEMP/candidate-proof/extracted" --phase installed --expect-commit "$EXPECTED_COMMIT" --platform-account --tool-smoke
      - name: Require direct and extracted sandboxed smoke
        if: always() && inputs.format == 'AppImage'
        env:
          DIRECT: ${{ steps.direct.outcome }}
          EXTRACTED: ${{ steps.extracted.outcome }}
        run: test "$DIRECT" = success && test "$EXTRACTED" = success
      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aino-native-resmoke-${{ inputs.platform }}-${{ inputs.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-proof
          retention-days: 14
          if-no-files-found: warn

  validate:
    if: inputs.artifact-id == ''
    name: Require a supported native smoke target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET: ${{ inputs.platform }}/${{ inputs.arch }}/${{ inputs.format }}
    steps:
      - name: Reject empty or unsupported native smoke jobs
        shell: bash
        run: |
          case "$TARGET" in
            darwin/arm64/dmg|darwin/x64/dmg|darwin/arm64/zip|darwin/x64/zip|win32/arm64/msix|win32/x64/msix|win32/arm64/msixbundle|win32/x64/msixbundle) ;;
            *) echo '::error::unsupported native smoke target'; exit 1 ;;
          esac

  macos:
    name: macOS install and chat
    needs: validate
    if: inputs.platform == 'darwin'
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 30
    # Also constrains the recording action's nested cache to read-only.
    cache-mode: read
    env: &smoke-env
      RELEASE_COMMIT: ${{ inputs.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      ARCHIVE_TAG: ${{ inputs.archive-tag }}
      COMMIT_BUILD: ${{ inputs.commit-build }}
      CHANNEL_BUILD: ${{ inputs.channel-build }}
      CHANNEL_REQUEST_SHA256: ${{ inputs.channel-request-sha256 }}
      PUBLIC_BASE: ${{ inputs.public-base }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ inputs.public-root }}
      R2_DISPOSABLE_RUN: ${{ inputs.disposable-run }}
      PLATFORM: ${{ inputs.platform }}
      ARCH: ${{ inputs.arch }}
      FORMAT: ${{ inputs.format }}
    steps: &smoke-steps
      - name: Isolate smoke paths
        shell: bash
        run: printf 'SMOKE_ROOT=%s/bundle-smoke\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # A dispatch tests the artifact of `sha` with the dispatched ref's scripts.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.channel-build != '' && inputs.controller-sha || inputs.sha }}
          persist-credentials: false

      - name: Set up driver tools only
        id: tools
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          packages: ffmpeg
          cache: false
          cache-python: false
          cache-node: false

      - name: Install locked chat driver dependencies
        id: dependencies
        shell: bash
        run: npm ci --workspace tests-js --include-workspace-root --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Fetch one exact downloadable artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_ROOT/out"
          product=$(HERMES_DESKTOP_VARIANT=bundled HERMES_PAYLOAD_TAG="$RELEASE_TAG" HERMES_BUILD_COMMIT="${RELEASE_COMMIT}" node -e 'if(process.env.HERMES_PAYLOAD_TAG)process.env.HERMES_BUILD_COMMIT=""; console.log(require("./apps/desktop/product-identity.cjs").artifactNamePascal)')
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            test "$COMMIT_BUILD" = false
            test -z "$RELEASE_TAG"
            python -m scripts.releases.channel_publish request --build-id "$CHANNEL_BUILD" \
              --request-sha256 "$CHANNEL_REQUEST_SHA256" --public-base "$PUBLIC_BASE" \
              --out "$SMOKE_ROOT/request.json"
            product=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["identity"]["artifactNamePascal"])' "$SMOKE_ROOT/request.json")
          fi
          case "$PLATFORM/$ARCH/$FORMAT" in
            darwin/arm64/dmg|darwin/x64/dmg|darwin/arm64/zip|darwin/x64/zip)
              name="darwin-$ARCH"; pattern="$product-*-mac-$ARCH.$FORMAT" ;;
            win32/arm64/msix|win32/x64/msix)
              name="win32-$ARCH"; pattern="$product-*-win-$ARCH.msix" ;;
            win32/arm64/msixbundle|win32/x64/msixbundle)
              name=windows-universal; pattern="$product-*-win.msixbundle" ;;
            *) echo '::error::unsupported native smoke target'; exit 1 ;;
          esac
          args=(--tag "${ARCHIVE_TAG:-$RELEASE_TAG}" --commit "$RELEASE_COMMIT")
          if [ "$COMMIT_BUILD" = true ]; then
            test -z "$RELEASE_TAG"
            args=(--commit-build "$RELEASE_COMMIT")
          fi
          if [ -n "${CHANNEL_BUILD:-}" ]; then args=(--channel-request "$SMOKE_ROOT/request.json"); fi
          python -m scripts.releases.handoff fetch --public-base "$PUBLIC_BASE" "${args[@]}" \
            --name "$name" --root "$SMOKE_ROOT/download" --include "$pattern" 2>&1 | tee "$SMOKE_ROOT/out/fetch.log"
          python - "$name" "$pattern" <<'PY'
          import fnmatch, json, os, sys
          from pathlib import Path
          from scripts.releases.r2 import file_sha256
          root = Path(os.environ['SMOKE_ROOT'])
          receipt = root / 'download' / f'handoff-{sys.argv[1]}.json'
          data = json.loads(receipt.read_text(encoding='utf-8'))
          selected = [row for row in data['files'] if fnmatch.fnmatchcase(row['path'], sys.argv[2])]
          if len(selected) != 1:
              raise ValueError(f'Expected exactly one non-Store artifact, found {len(selected)}')
          row = selected[0]
          artifact = root / 'download' / row['path']
          if artifact.stat().st_size != row['size'] or file_sha256(artifact) != row['sha256']:
              raise ValueError('Downloaded artifact no longer matches its receipt')
          (root / 'out' / 'download.json').write_text(json.dumps({
              'commit': data['commit'], 'tag': data.get('tag'), 'receipt': receipt.name,
              'receiptSha256': file_sha256(receipt), 'artifact': row, 'request': data.get('request'),
          }, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={artifact.resolve().as_posix()}\n')
          PY

      - name: Start screen recording
        id: recording
        uses: ./.github/actions/e2e-screen-record
        with:
          mode: start
          output: ${{ env.SMOKE_ROOT }}/out/recording.mkv

      - name: Install and chat on macOS
        id: macos-chat
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          if [ -n "${CHANNEL_BUILD:-}" ]; then args+=(--channel-request "$SMOKE_ROOT/request.json"); fi
          bash tests/install/macos-bundle-smoke.sh --artifact "$ARTIFACT" --arch "$ARCH" \
            --commit "$RELEASE_COMMIT" "${args[@]}" --work "$SMOKE_ROOT/work" --out "$SMOKE_ROOT/out"

      - name: Install and chat on Windows
        id: windows-chat
        if: runner.os == 'Windows'
        shell: powershell
        env:
          ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: |
          $tagArgs = @()
          if ($env:RELEASE_TAG) { $tagArgs = @('-Tag', $env:RELEASE_TAG) }
          if ($env:CHANNEL_BUILD) { $tagArgs = @('-ChannelRequest', "$env:SMOKE_ROOT/request.json") }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/install/windows-bundle-smoke.ps1 -Artifact $env:ARTIFACT -Arch $env:ARCH -Commit $env:RELEASE_COMMIT @tagArgs -Work "$env:SMOKE_ROOT/work" -Out "$env:SMOKE_ROOT/out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop screen recording
        if: always()
        # Evidence only. A failed stop must not fail a chat that already passed.
        continue-on-error: true
        uses: ./.github/actions/e2e-screen-record
        with:
          mode: stop
          output: ${{ env.SMOKE_ROOT }}/out/recording.mkv

      - name: Record smoke step outcomes
        if: always()
        shell: bash
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$SMOKE_ROOT/out"
          printf '%s\n' "$STEP_RESULTS" > "$SMOKE_ROOT/out/steps.json"

      - name: Upload smoke diagnostics
        if: always()
        # Evidence only. A 403 from the artifact store must not fail the smoke.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.format }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Only evidence, never the isolated profile or installed application.
          path: ${{ env.SMOKE_ROOT }}/out
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows install and chat
    needs: validate
    if: inputs.platform == 'win32'
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    # windows-11-arm runners are much slower (npm ci alone runs 12+ minutes and
    # the MSIX leg exceeds 30 total); x64 legs complete in ~14.
    timeout-minutes: 45
    cache-mode: read
    env: *smoke-env
    steps: *smoke-steps
