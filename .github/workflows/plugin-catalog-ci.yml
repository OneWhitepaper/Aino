name: Plugin Catalog CI

# Admission gate for plugin-catalog entries. Fires ONLY on PRs touching
# plugin-catalog/** so it can never go red on unrelated PRs.
#
# Two gates:
#   structural            — cheap schema check, no hermes install needed
#   pinned-source-validate — supply-chain gate: the pinned sha MUST be
#                            reachable in the entry's repo, and the plugin
#                            at that exact commit must pass
#                            `hermes plugins validate`.

on:
  pull_request:
    paths:
      - "plugin-catalog/**"

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false # this job is read-only

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install ruamel.yaml
        uses: ./.github/actions/retry
        with:
          command: pip install ruamel.yaml==0.18.17

      - name: Validate catalog files (structural)
        run: |
          set -euo pipefail
          # Validating the whole directory is simpler than diffing and keeps
          # the invariant that EVERYTHING in plugin-catalog/ stays valid.
          python3 scripts/validate_plugin_catalog.py plugin-catalog/

  pinned-source-validate:
    runs-on: ubuntu-latest
    # Release imports validate hundreds of pinned entries through the same gates.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # Full commit graph + tags, blobs on demand: the diff below needs the
          # merge commit's first parent, and Hermes resolves its own version
          # from the release tags merged into HEAD. A shallow checkout reports
          # "unknown", which plugins checking the host version reject (omh).
          fetch-depth: 0
          filter: blob:none
          # `hermes plugins validate` below runs pinned-repo code; keep the
          # job's token out of .git/config where that code could read it.
          persist-credentials: false

      - name: Find changed catalog entries
        id: changed
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit: diffing it against its first parent is
          # exactly what the PR would land. Refuse anything else rather than
          # silently diffing a single commit.
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::expected the pull_request merge commit as HEAD"
            exit 1
          fi

          # A v0.23.1 upstream import is the one reviewed exception to the
          # entry-PR data-only rule.  GitHub checks out the PR merge commit, so
          # its second parent is the proposed PR head and its first parent is
          # the target branch.  The release must be present in the PR head but
          # absent from the target branch; once main contains it this exception
          # expires and the normal admission rule applies again.
          UPSTREAM=3b421578588243f920886e6fe79a6faa87ea026e
          CATALOG_TREE=3df55a3c113e79a77db5f6826668aabaf3bea7f8
          IMPORTING_UPSTREAM=false
          if git merge-base --is-ancestor "$UPSTREAM" HEAD^2 \
              && ! git merge-base --is-ancestor "$UPSTREAM" HEAD^1; then
            IMPORTING_UPSTREAM=true
            # Pin the reviewed import's exact catalog tree. It retains Aino's
            # existing Experiential Labs entry and excludes AtmoRouter because
            # its pinned repository could not be cloned during review. Other
            # imported entries continue through the pinned-source gate below.
            # AI SENSE, Toll and Hermes Android use reachable replacement commits with plugin
            # subtrees identical to their original pins (recorded in each entry).
            # Any unreviewed catalog edit is rejected.
            if [ "$(git rev-parse HEAD:plugin-catalog)" != "$CATALOG_TREE" ]; then
              echo "::error::upstream import changed plugin-catalog/ beyond reviewed v0.23.1"
              exit 1
            fi
            # The import must use the release's reviewed enforcement inputs.
            # These files are consumed by this job before any plugin code runs;
            # keeping them byte-for-byte pinned prevents an import PR from
            # weakening the scanner or PM setup while it is being admitted.
            if ! git diff --quiet "$UPSTREAM" -- \
                scripts/ci/catalog_changed_entries.py \
                scripts/ci/catalog_entry_fields.py \
                scripts/ci/catalog_validate_pinned_entries.py \
                scripts/scan_plugin_payloads.py \
                scripts/validate_plugin_catalog.py \
                .github/actions/setup-pm/action.yml; then
              echo "::error::upstream import changed catalog enforcement inputs"
              exit 1
            fi
            echo "validation_ref=$UPSTREAM" >> "$GITHUB_OUTPUT"
            echo "validation_catalog_tree=$CATALOG_TREE" >> "$GITHUB_OUTPUT"
            echo "Validated reviewed upstream import $UPSTREAM"
          fi
          # Added + modified + renamed + typechanged entry files only; deletions
          # and removed.yaml have nothing to clone. A rename or file->symlink
          # change that slipped past this list would skip the supply-chain gate.
          CHANGED=$(git diff --name-only --diff-filter=AMRT 'HEAD^1' HEAD \
            -- 'plugin-catalog/*.yaml' 'plugin-catalog/*.yml')
          # The grep can only shrink the list and runs on its own so a git diff
          # failure still fails the step instead of looking like "no changes".
          CHANGED=$(printf '%s' "$CHANGED" | grep -v '/removed\.yaml$' || true)

          if [ -n "$CHANGED" ] && [ "$IMPORTING_UPSTREAM" != true ]; then
            # Admission PRs must be data-only: the gate's own enforcement code
            # (this workflow, the validator, the composite actions, the built
            # hermes) resolves from the PR checkout, so an entry PR that also
            # touches tooling could neuter the gate vetting it. Contributor
            # email maps are data the gate never executes; README/policy/CI PRs
            # with no entry change skip this check.
            ALL=$(git diff --name-only 'HEAD^1' HEAD)
            OUTSIDE=$(printf '%s' "$ALL" | grep -vE '^(plugin-catalog|contributors/emails)/' || true)
            if [ -n "$OUTSIDE" ]; then
              echo "::error::catalog entry PRs may only touch plugin-catalog/** and contributors/emails/**, found:"
              # Filenames are PR-controlled; a newline in one could smuggle a
              # workflow command into the log.
              printf '%s' "$OUTSIDE" | tr '\0\n' ' '
              echo
              exit 1
            fi
          fi

          echo "Changed catalog entries:"
          echo "${CHANGED:-<none>}"
          {
            echo 'files<<__EOF__'
            echo "$CHANGED"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Check out reviewed upstream validation tree
        if: steps.changed.outputs.files != '' && steps.changed.outputs.validation_ref != ''
        env:
          VALIDATION_REF: ${{ steps.changed.outputs.validation_ref }}
          VALIDATION_CATALOG_TREE: ${{ steps.changed.outputs.validation_catalog_tree }}
        run: |
          set -euo pipefail
          # Keep the original PR's changed-entry output, but load the complete
          # runtime, PM actions and scanners from the fixed reviewed commit.
          # Cleaning also prevents untracked PR modules shadowing trusted code.
          git checkout --detach "$VALIDATION_REF"
          git clean -ffdx
          # Fork tags describe Aino releases, so they do not establish the
          # upstream runtime version. Fetch the reviewed official tag locally
          # and verify both its immutable tag object and peeled release commit
          # before setup or plugin code can consume its version identity.
          REVIEWED_TAG=v0.23.1
          REVIEWED_TAG_OBJECT=b65acf3fdc1d43bd889211ea8e37032974b395a5
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "refs/tags/$REVIEWED_TAG"
          if [ "$(git rev-parse FETCH_HEAD)" != "$REVIEWED_TAG_OBJECT" ] \
              || [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$VALIDATION_REF" ]; then
            echo "::error::official release tag does not match the reviewed upstream import"
            exit 1
          fi
          git update-ref "refs/tags/$REVIEWED_TAG" "$REVIEWED_TAG_OBJECT"
          # Validate the exact admitted catalog data, including reviewed pins
          # whose plugin trees are unchanged but whose old commits disappeared
          # from the remote's advertised history. Only catalog data is restored;
          # the runtime, scanners and PM setup stay at the reviewed release.
          git rm -r --quiet -- plugin-catalog
          git read-tree -u --prefix=plugin-catalog/ "$VALIDATION_CATALOG_TREE"
          if [ "$(git write-tree --prefix=plugin-catalog/)" != "$VALIDATION_CATALOG_TREE" ] \
              || ! git diff --quiet -- plugin-catalog; then
            echo "::error::validation catalog differs from the reviewed tree"
            exit 1
          fi

      - name: Prepare Hermes from the validation checkout
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'

      - name: Clone each entry at its pinned sha and validate
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # A hostile repo URL must never block the job on a credential prompt.
          GIT_TERMINAL_PROMPT: "0"
          # `gh attestation verify` (README rule 17) reads the attestation from
          # GitHub and needs a token. Read-only default token; the step runs
          # pinned-repo code, so nothing broader is exposed here.
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$GITHUB_WORKSPACE/scripts/ci/catalog_validate_pinned_entries.py"
