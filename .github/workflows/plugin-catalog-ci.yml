name: Plugin Catalog CI

# Admission gate for plugin-catalog entries. Fires ONLY on PRs touching
# plugin-catalog/** so it can never go red on unrelated PRs.
#
# Two gates:
#   structural            — cheap schema check, no hermes install needed
#   pinned-source-validate — supply-chain gate: the pinned sha MUST be
#                            reachable in the entry's repo, and the plugin
#                            at that exact commit must pass
#                            `hermes plugins validate`.

on:
  pull_request:
    paths:
      - "plugin-catalog/**"

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false # this job is read-only

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install ruamel.yaml
        uses: ./.github/actions/retry
        with:
          command: pip install ruamel.yaml==0.18.17

      - name: Validate catalog files (structural)
        run: |
          set -euo pipefail
          # Validating the whole directory is simpler than diffing and keeps
          # the invariant that EVERYTHING in plugin-catalog/ stays valid.
          python3 scripts/validate_plugin_catalog.py plugin-catalog/

  pinned-source-validate:
    runs-on: ubuntu-latest
    # Release imports validate hundreds of pinned entries through the same gates.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # Full commit graph + tags, blobs on demand: the diff below needs the
          # merge commit's first parent, and Hermes resolves its own version
          # from the release tags merged into HEAD. A shallow checkout reports
          # "unknown", which plugins checking the host version reject (omh).
          fetch-depth: 0
          filter: blob:none
          # `hermes plugins validate` below runs pinned-repo code; keep the
          # job's token out of .git/config where that code could read it.
          persist-credentials: false

      - name: Find changed catalog entries
        id: changed
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit: diffing it against its first parent is
          # exactly what the PR would land. Refuse anything else rather than
          # silently diffing a single commit.
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::expected the pull_request merge commit as HEAD"
            exit 1
          fi

          # A v0.23.0 upstream import is the one reviewed exception to the
          # entry-PR data-only rule.  GitHub checks out the PR merge commit, so
          # its second parent is the proposed PR head and its first parent is
          # the target branch.  The release must be present in the PR head but
          # absent from the target branch; once main contains it this exception
          # expires and the normal admission rule applies again.
          UPSTREAM=2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          CATALOG_TREE=d34b910d6489705a6e49f2bb5b51ba8644ef2cd3
          IMPORTING_UPSTREAM=false
          if git merge-base --is-ancestor "$UPSTREAM" HEAD^2 \
              && ! git merge-base --is-ancestor "$UPSTREAM" HEAD^1; then
            IMPORTING_UPSTREAM=true
            # Pin the reviewed import's exact catalog tree. It retains Aino's
            # existing Experiential Labs entry and excludes AtmoRouter because
            # its pinned repository could not be cloned during review. Other
            # imported entries continue through the pinned-source gate below.
            # AI SENSE and Toll use reachable replacement commits with plugin
            # subtrees identical to their original pins (recorded in each entry).
            # Any unreviewed catalog edit is rejected.
            if [ "$(git rev-parse HEAD:plugin-catalog)" != "$CATALOG_TREE" ]; then
              echo "::error::upstream import changed plugin-catalog/ beyond reviewed v0.23.0"
              exit 1
            fi
            # The import must use the release's reviewed enforcement inputs.
            # These files are consumed by this job before any plugin code runs;
            # keeping them byte-for-byte pinned prevents an import PR from
            # weakening the scanner or PM setup while it is being admitted.
            if ! git diff --quiet "$UPSTREAM" -- \
                scripts/scan_plugin_payloads.py \
                scripts/validate_plugin_catalog.py \
                .github/actions/setup-pm/action.yml; then
              echo "::error::upstream import changed catalog enforcement inputs"
              exit 1
            fi
            echo "validation_ref=$UPSTREAM" >> "$GITHUB_OUTPUT"
            echo "validation_catalog_tree=$CATALOG_TREE" >> "$GITHUB_OUTPUT"
            echo "Validated reviewed upstream import $UPSTREAM"
          fi
          # Added + modified + renamed + typechanged entry files only; deletions
          # and removed.yaml have nothing to clone. A rename or file->symlink
          # change that slipped past this list would skip the supply-chain gate.
          CHANGED=$(git diff --name-only --diff-filter=AMRT 'HEAD^1' HEAD \
            -- 'plugin-catalog/*.yaml' 'plugin-catalog/*.yml')
          # The grep can only shrink the list and runs on its own so a git diff
          # failure still fails the step instead of looking like "no changes".
          CHANGED=$(printf '%s' "$CHANGED" | grep -v '/removed\.yaml$' || true)

          if [ -n "$CHANGED" ] && [ "$IMPORTING_UPSTREAM" != true ]; then
            # Admission PRs must be data-only: the gate's own enforcement code
            # (this workflow, the validator, the composite actions, the built
            # hermes) resolves from the PR checkout, so an entry PR that also
            # touches tooling could neuter the gate vetting it. Contributor
            # email maps are data the gate never executes; README/policy/CI PRs
            # with no entry change skip this check.
            ALL=$(git diff --name-only 'HEAD^1' HEAD)
            OUTSIDE=$(printf '%s' "$ALL" | grep -vE '^(plugin-catalog|contributors/emails)/' || true)
            if [ -n "$OUTSIDE" ]; then
              echo "::error::catalog entry PRs may only touch plugin-catalog/** and contributors/emails/**, found:"
              # Filenames are PR-controlled; a newline in one could smuggle a
              # workflow command into the log.
              printf '%s' "$OUTSIDE" | tr '\0\n' ' '
              echo
              exit 1
            fi
          fi

          echo "Changed catalog entries:"
          echo "${CHANGED:-<none>}"
          {
            echo 'files<<__EOF__'
            echo "$CHANGED"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Check out reviewed upstream validation tree
        if: steps.changed.outputs.files != '' && steps.changed.outputs.validation_ref != ''
        env:
          VALIDATION_REF: ${{ steps.changed.outputs.validation_ref }}
          VALIDATION_CATALOG_TREE: ${{ steps.changed.outputs.validation_catalog_tree }}
        run: |
          set -euo pipefail
          # Keep the original PR's changed-entry output, but load the complete
          # runtime, PM actions and scanners from the fixed reviewed commit.
          # Cleaning also prevents untracked PR modules shadowing trusted code.
          git checkout --detach "$VALIDATION_REF"
          git clean -ffdx
          # Fork tags describe Aino releases, so they do not establish the
          # upstream runtime version. Fetch the reviewed official tag locally
          # and verify both its immutable tag object and peeled release commit
          # before setup or plugin code can consume its version identity.
          REVIEWED_TAG=v0.23.0
          REVIEWED_TAG_OBJECT=df1774294af26285ae758c6114f3f2f60e2a602d
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "refs/tags/$REVIEWED_TAG"
          if [ "$(git rev-parse FETCH_HEAD)" != "$REVIEWED_TAG_OBJECT" ] \
              || [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$VALIDATION_REF" ]; then
            echo "::error::official release tag does not match the reviewed upstream import"
            exit 1
          fi
          git update-ref "refs/tags/$REVIEWED_TAG" "$REVIEWED_TAG_OBJECT"
          # Validate the exact admitted catalog data, including reviewed pins
          # whose plugin trees are unchanged but whose old commits disappeared
          # from the remote's advertised history. Only catalog data is restored;
          # the runtime, scanners and PM setup stay at the reviewed release.
          git rm -r --quiet -- plugin-catalog
          git read-tree -u --prefix=plugin-catalog/ "$VALIDATION_CATALOG_TREE"
          if [ "$(git write-tree --prefix=plugin-catalog/)" != "$VALIDATION_CATALOG_TREE" ] \
              || ! git diff --quiet -- plugin-catalog; then
            echo "::error::validation catalog differs from the reviewed tree"
            exit 1
          fi

      - name: Prepare Hermes from the validation checkout
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'

      - name: Clone each entry at its pinned sha and validate
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # A hostile repo URL must never block the job on a credential prompt.
          GIT_TERMINAL_PROMPT: "0"
          # `gh attestation verify` (README rule 17) reads the attestation from
          # GitHub and needs a token. Read-only default token; the step runs
          # pinned-repo code, so nothing broader is exposed here.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED=0
          WORKROOT=$(realpath "$(mktemp -d)")
          # Entries arrive on fd 3, not stdin: `hermes plugins validate` executes
          # plugin-declared install code that could otherwise read stdin and
          # silently drain the remaining entry list.
          while IFS= read -r entry <&3; do
            [ -z "$entry" ] && continue
            echo "::group::validate $entry"

            # A symlinked or missing entry file is not a catalog entry.
            if [ -L "$entry" ] || [ ! -f "$entry" ]; then
              echo "::error file=$entry::catalog entry must be a regular file"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # Parse repo / sha / subdir from the entry yaml. These fields are
            # PR-controlled, so the entry is rejected here before anything uses
            # them -- the clone must be remote-only and the subdir a plain
            # relative path, or the pinned sha ends up validating files outside
            # the pinned commit. `python3 -I` keeps the PR checkout's own
            # modules off sys.path (cwd is the PR tree) so it cannot shadow the
            # parser's imports; ruamel.yaml comes from installed packages.
            PARSED=$(python3 -I - "$entry" <<'PYEOF'
          import re
          import shlex
          import sys

          from ruamel.yaml import YAML

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = YAML(typ='safe').load(fh)
          except Exception:
              data = None
          repo = str(data.get('repo', '')) if isinstance(data, dict) else ''
          sha = data.get('sha', '') if isinstance(data, dict) else ''
          subdir_raw = data.get('subdir', '') if isinstance(data, dict) else ''
          if subdir_raw is None:
              subdir_raw = ''  # `subdir:` with no value means the repo root
          subdir = subdir_raw if isinstance(subdir_raw, str) else ''
          bad = ""
          if data is None:
              bad = "entry yaml is empty or unparseable"
          elif not isinstance(data, dict):
              bad = "entry yaml must be a mapping"
          elif not re.fullmatch(r"https://\S+", repo):
              # No whitespace either: the value is echoed into the log, where a
              # newline would smuggle workflow commands like ::error::.
              bad = "repo must be an https:// git URL"
          elif not isinstance(sha, str):
              bad = "sha must be a string"
          elif not re.fullmatch(r"[0-9a-f]{40}", sha):
              # A ref name would validate the branch tip, not the pin; a leading
              # '-' would become a checkout option.
              bad = "sha must be exactly 40 lowercase hex characters"
          elif not isinstance(subdir_raw, str):
              # Never coerce: a falsy non-string (0, false) would silently mean
              # the clone root while the structural gate rejects the entry.
              bad = "subdir must be a string"
          elif subdir and (
              not re.fullmatch(r"[A-Za-z0-9._/-]+", subdir)
              or any(seg in ("", ".", "..") for seg in subdir.split("/"))
          ):
              bad = "subdir must be a relative path without '.' or '..' segments"
          print(f"REPO={shlex.quote(repo)}")
          print(f"SHA={shlex.quote(str(sha))}")
          print(f"SUBDIR={shlex.quote(subdir)}")
          print(f"BAD={shlex.quote(bad)}")
          PYEOF
          ) || PARSED="BAD='catalog entry parser failed'"
            # Reset before eval: a killed or truncated parser must not let this
            # entry inherit a previous entry's repo/sha and pass on its content.
            REPO="" SHA="" SUBDIR="" BAD=""
            eval "$PARSED"
            # Check before echo: a rejected value must never reach the log, where
            # a newline in it would smuggle workflow commands like ::error::.
            if [ -n "$BAD" ]; then
              echo "::error file=$entry::$BAD"
              FAILED=1; echo "::endgroup::"; continue
            fi
            echo "repo=$REPO sha=$SHA subdir=$SUBDIR"

            CLONE_DIR=$(realpath "$(mktemp -d -p "$WORKROOT")")
            # Full clone (no --depth 1): the pinned sha may not be the branch tip.
            # 600s: listed repos reach >1 GB (hermes-jackal-verified 1.43 GB,
            # hindsight 741 MB); 120s would false-fail a re-pin on a slow runner.
            if ! timeout 600 git clone "$REPO" "$CLONE_DIR" </dev/null; then
              echo "::error file=$entry::clone failed for $REPO"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # The pin must name a commit object -- a tag-object sha would peel
            # to a commit the reviewer never declared as the pin.
            if [ "$(git -C "$CLONE_DIR" cat-file -t "$SHA" 2>/dev/null)" != "commit" ]; then
              echo "::error file=$entry::pinned sha $SHA is not a commit object in $REPO"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # SUPPLY-CHAIN GATE: the pinned sha must be reachable in the repo.
            if ! git -C "$CLONE_DIR" checkout --detach "$SHA" </dev/null; then
              echo "::error file=$entry::pinned sha $SHA is not reachable in $REPO"
              FAILED=1; echo "::endgroup::"; continue
            fi

            PLUGIN_DIR="$CLONE_DIR${SUBDIR:+/$SUBDIR}"
            # A symlinked directory inside the clone could still point outside
            # it, so confine the resolved path under the clone, not the lexical one.
            RESOLVED_DIR=$(realpath -m -- "$PLUGIN_DIR")
            if [ "$RESOLVED_DIR" != "$CLONE_DIR" ] && [ "${RESOLVED_DIR#"$CLONE_DIR"/}" = "$RESOLVED_DIR" ]; then
              echo "::error file=$entry::subdir '$SUBDIR' resolves outside the pinned clone"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # Confinement is per-symlink too, across the whole clone: find does
            # not descend into a symlinked directory, so an allowed in-clone
            # link like plugin/ext -> ../lib would otherwise hide lib/evil ->
            # /outside from a PLUGIN_DIR-only scan while reads through it still
            # escape the pin.
            if ! find "$CLONE_DIR" -path "$CLONE_DIR/.git" -prune -o -type l -print0 | while IFS= read -r -d '' link; do
                target=$(realpath -m -- "$link")
                case "$target" in "$CLONE_DIR"|"$CLONE_DIR"/*) ;; *) exit 1 ;; esac
              done; then
              echo "::error file=$entry::a symlink in the repo resolves outside the pinned clone"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # Native plugin.yaml OR portable Agent Plugins v1 plugin.json
            # (#81196; native manifest wins when both exist).
            if [ ! -f "$PLUGIN_DIR/plugin.yaml" ] && [ ! -f "$PLUGIN_DIR/plugin.yml" ] && [ ! -f "$PLUGIN_DIR/plugin.json" ]; then
              echo "::error file=$entry::no plugin.yaml or plugin.json at subdir '$SUBDIR' of $REPO@$SHA"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # Manifest schema + declared-vs-registered capability check.
            if ! timeout 600 hermes plugins validate --install-deps "$PLUGIN_DIR" </dev/null; then
              echo "::error file=$entry::hermes plugins validate failed"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # UNSCANNABLE-PAYLOAD GATE (README rule 17). A reviewer and the install
            # scanner must be able to read everything shipped at the pin as source:
            # no compiled binaries (by header), committed bytecode, or archives
            # hiding either. Entries that genuinely need a native component list
            # each one under `attested_binaries:` and the binary must carry a
            # GitHub build-provenance attestation tying it to this repo's own
            # workflow at the pinned source digest; those paths are exempted here
            # and verified below. No stdin: the parser must not drain the entry fd.
            ATTESTED=$(python3 -I - "$entry" <<'PYEOF' </dev/null
          import re, shlex, sys
          from ruamel.yaml import YAML
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = YAML(typ="safe").load(fh)
          except Exception:
              data = None
          paths = data.get("attested_binaries") if isinstance(data, dict) else None
          if not isinstance(paths, list):
              paths = []
          ok = []
          for p in paths:
              # Relative path, no '.'/'..' segments, no absolute/newline: it is
              # joined onto the clone and echoed into the log.
              if (isinstance(p, str) and re.fullmatch(r"[A-Za-z0-9._/-]+", p)
                      and not any(seg in ("", ".", "..") for seg in p.split("/"))):
                  ok.append(p)
              else:
                  print("BAD=" + shlex.quote(f"attested_binaries entry {p!r} is not a plain relative path"))
                  sys.exit(0)
          print("PATHS=" + shlex.quote("\n".join(ok)))
          PYEOF
          ) || ATTESTED="BAD='attested_binaries parser failed'"
            ATT_BAD=""; ATT_PATHS=""
            eval "${ATTESTED/PATHS=/ATT_PATHS=}"; eval "${ATTESTED/BAD=/ATT_BAD=}" 2>/dev/null || true
            if [ -n "${ATT_BAD:-}" ]; then
              echo "::error file=$entry::$ATT_BAD"
              FAILED=1; echo "::endgroup::"; continue
            fi
            # Verify each declared binary's provenance against THIS repo at the
            # pinned commit; a verified path is dropped from the clone so the
            # detector that follows ignores it, and any other binary still fails.
            ATT_OK=1
            if [ -n "${ATT_PATHS:-}" ]; then
              OWNER_REPO=$(printf '%s' "$REPO" | sed -E 's#^https://github\.com/##; s#\.git$##; s#/$##')
              while IFS= read -r bpath; do
                [ -z "$bpath" ] && continue
                BFILE="$PLUGIN_DIR/$bpath"
                if [ ! -f "$BFILE" ] || [ -L "$BFILE" ]; then
                  echo "::error file=$entry::attested_binaries path is not a regular file: $bpath"
                  ATT_OK=0; break
                fi
                if ! timeout 120 gh attestation verify "$BFILE" \
                    --repo "$OWNER_REPO" --source-digest "$SHA" \
                    --predicate-type https://slsa.dev/provenance/v1 </dev/null; then
                  echo "::error file=$entry::no build-provenance attestation for $bpath at $OWNER_REPO@$SHA (README rule 17)"
                  ATT_OK=0; break
                fi
                rm -f -- "$BFILE"
              done <<EOF_ATT
          $ATT_PATHS
          EOF_ATT
            fi
            if [ "$ATT_OK" -ne 1 ]; then
              FAILED=1; echo "::endgroup::"; continue
            fi
            if ! PAYLOAD=$(python3 "$GITHUB_WORKSPACE/scripts/scan_plugin_payloads.py" "$PLUGIN_DIR" </dev/null); then
              # Filenames are repo-controlled: strip newlines so none can forge a
              # workflow command in the log.
              echo "::error file=$entry::unscannable executable payload (README rule 17): $(printf '%s' "$PAYLOAD" | tr '\n' ';')"
              FAILED=1; echo "::endgroup::"; continue
            fi

            # SELF-UPDATER GATE (README rule 3): the pin is the only update path.
            # A desktop bundle that both fetches from GitHub AND writes/renames
            # plugin files is a self-updater; either half alone is fine (a
            # plugin may read the API, or manage its own data files).
            # NUL-delimited both ways: committed filenames with spaces or
            # newlines must not split into grep options or forged log lines.
            SELF_UPDATE=$(grep -rlZE 'releases/latest|releases/download|raw\.githubusercontent\.com|codeload\.github\.com' \
                --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' \
                --include='*.jsx' --include='*.tsx' --include='*.mts' --include='*.cts' \
                "$PLUGIN_DIR" \
              | xargs -r0 grep -lZE 'writeTextFile|renamePath|writeFile\(|writeFileSync|renameSync|copyFileSync|cpSync|createWriteStream' || true)
            SELF_UPDATE=$(printf '%s' "$SELF_UPDATE" | tr '\0\n' ' ')
            if [ -n "$SELF_UPDATE" ]; then
              echo "::error file=$entry::self-updating code in catalog build (fetches GitHub AND writes plugin files): $SELF_UPDATE"
              FAILED=1; echo "::endgroup::"; continue
            fi
            echo "✅ PASS: $entry"
            echo "::endgroup::"
          done 3<<< "$CHANGED_FILES"
          rm -rf "$WORKROOT"

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ FAIL: one or more catalog entries failed pinned-source validation"
            exit 1
          fi
          echo "✅ PASS: all changed catalog entries validated at their pinned shas"
