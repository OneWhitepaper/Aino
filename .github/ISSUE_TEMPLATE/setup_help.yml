name: "🔧 Setup / Installation Help"
description: Having trouble installing or configuring Aino? Ask here.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you're having trouble! Please fill out the details below so we can help.

        **Quick checks first:**
        - Include the exact error shown by Aino in the Debug Report section below
        - Check Settings → About for application updates
        - For installation and configuration guidance, read the [Aino guide](https://petoi.cn/guide.html)

  - type: textarea
    id: description
    attributes:
      label: What's Going Wrong?
      description: Describe what you're trying to do and where it fails.
      placeholder: |
        I installed Aino from the download page, but when I open it I see...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: What did you do? Include the exact commands you ran.
      placeholder: |
        1. Downloaded the installer for my system and architecture
        2. Installed and opened Aino
        3. Selected a model or configured a provider
        4. Started a conversation and saw the error...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - macOS DMG / ZIP
        - Windows installer
        - Linux AppImage / DEB / RPM
        - Source checkout (see CONTRIBUTING.md)
        - Existing remote runtime
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version` (or `python3 --version`)
      placeholder: "3.11.9"

  - type: input
    id: hermes-version
    attributes:
      label: Aino Version
      description: Application version from Settings → About, or `hermes version` for a source runtime
      placeholder: "Version shown in Settings → About"

  - type: textarea
    id: debug-report
    attributes:
      label: Debug Report (optional)
      description: |
        Paste relevant redacted error details from Aino. Remove credentials and private conversation content.
        For source-runtime problems, include local diagnostic output if available.
        The optional “Send diagnostics to Nous” action sends a separate private bundle to Nous;
        an Aino issue does not give Aino maintainers access to that bundle.
      placeholder: |
        Application version:
        Connection type:
        Error details:
      render: shell

  - type: textarea
    id: error-output
    attributes:
      label: Full Error Output
      description: Paste the complete error message or traceback. This will be auto-formatted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I've Already Tried
      description: List any fixes or workarounds you've already attempted.
      placeholder: |
        - Checked Settings → About for updates
        - Reopened the application
        - Checked the selected model and connection settings
